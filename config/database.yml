# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
#
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: backend_development

test:
  <<: *default
  database: backend_test

# PRODUCTION CONFIG FOR RENDER
# ---------------------------
# Render provides a full DATABASE_URL, so production must use ONLY that.
# No multi-database setup. No usernames. No passwords. No "primary/cache/queue".
#
production:
  url: <%= ENV["DATABASE_URL"] %>
